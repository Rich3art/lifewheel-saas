name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag name
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, fileinfo, filter, json, openssl, pdo, pdo_mysql, session, tokenizer, xml, zip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Validate release packager
        run: php scripts/release/package.php --version="${{ inputs.version }}" --dry-run

      - name: Create release ZIPs
        run: php scripts/release/package.php --version="${{ inputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifewheel-release-${{ inputs.version }}
          path: build/releases/${{ inputs.version }}
